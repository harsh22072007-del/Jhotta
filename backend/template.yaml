AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Jhotta - login + backup (Cognito, API Gateway HTTP API, Lambda, DynamoDB) and static hosting (S3 + CloudFront)

Parameters:
  GoogleClientId:
    Type: String
    Description: OAuth client id from Google Cloud Console
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: OAuth client secret (stays in Cognito, never in the PWA)
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique prefix, e.g. jhotta-yourname -> https://jhotta-yourname.auth.ap-south-1.amazoncognito.com

Resources:
  # ---------- DynamoDB: one table, replica of the device events ----------
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: jhotta
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------- Cognito: Google sign-in only ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: jhotta
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]

  GoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        name: name
        username: sub

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref CognitoDomainPrefix

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleProvider
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: jhotta-pwa
      GenerateSecret: false # public client + PKCE
      SupportedIdentityProviders: [Google]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - !Sub 'https://${Distribution.DomainName}/auth/callback'
        - http://localhost:5173/auth/callback
      LogoutURLs:
        - !Sub 'https://${Distribution.DomainName}'
        - http://localhost:5173
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { IdToken: minutes, AccessToken: minutes, RefreshToken: days }

  # ---------- API Gateway HTTP API + Lambda ----------
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${Distribution.DomainName}'
          - http://localhost:5173
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, OPTIONS]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience: [!Ref UserPoolClient]

  PushFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      CodeUri: src/
      Handler: sync.push
      MemorySize: 256
      Timeout: 20
      Environment: { Variables: { TABLE_NAME: !Ref Table } }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
      Events:
        Push:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /sync/push, Method: POST }

  PullFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      CodeUri: src/
      Handler: sync.pull
      MemorySize: 256
      Timeout: 20
      Environment: { Variables: { TABLE_NAME: !Ref Table } }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
      Events:
        Pull:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /sync/pull, Method: GET }

  # ---------- S3 + CloudFront (private bucket, HTTPS only) ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: jhotta-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccess.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        # single-page app: unknown paths (e.g. /goals, /auth/callback) fall back to index.html
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  SiteUrl: { Value: !Sub 'https://${Distribution.DomainName}' }
  ApiUrl: { Value: !GetAtt Api.ApiEndpoint }
  CognitoDomain: { Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com' }
  UserPoolClientId: { Value: !Ref UserPoolClient }
  GoogleRedirectUri: { Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse' }
  BucketName: { Value: !Ref SiteBucket }
  DistributionId: { Value: !Ref Distribution }
